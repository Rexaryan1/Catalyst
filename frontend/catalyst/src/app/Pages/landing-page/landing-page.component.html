<div class="dashboard-container text-white">
  <div class="bento-shell">

    <div class="bento-col bento-col--left">
      <div class="bento-tile bento-tile--session" style="position: relative;">
        <app-session-summary />
        <app-onboarding-popup *ngIf="onboardingStep === 0" [step]="steps[0]" [stepIndex]="0" [totalSteps]="steps.length"
          [arrowPosition]="'top'" [arrowOffset]="'center'" [width]="'320px'" (advance)="nextOnboardingStep()"
          (back)="prevOnboardingStep()" />
      </div>
    </div>

    <div class="bento-col bento-col--right">
      <section class="bento-tile bento-tile--dashboard" style="position: relative;">
        <landing-dashboard-card />
        <app-onboarding-popup *ngIf="onboardingStep === 1" [step]="steps[1]" [stepIndex]="1" [totalSteps]="steps.length"
          [arrowPosition]="'top'" [arrowOffset]="'center'" [width]="'300px'" (advance)="nextOnboardingStep()"
          (back)="prevOnboardingStep()" />
      </section>

      <section class="bento-tile bento-tile--profile" style="position: relative;">
        <app-profile-summary />
        <app-onboarding-popup *ngIf="onboardingStep === 2" [step]="steps[2]" [stepIndex]="2" [totalSteps]="steps.length"
          [arrowPosition]="'top'" [arrowOffset]="'center'" [width]="'300px'" (advance)="nextOnboardingStep()"
          (back)="prevOnboardingStep()" />
      </section>

      <div class="quick-access-row">
        <app-quick-access />
      </div>
    </div>

  </div>
</div>
