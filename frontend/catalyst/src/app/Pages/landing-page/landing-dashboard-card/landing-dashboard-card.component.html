<div class="dashboard-card" role="button" tabindex="0" aria-label="Open dashboard" (click)="openDashboard()" (keydown.enter)="openDashboard()">
  <div class="dashboard-card__rail">
    <span class="dashboard-card__arrow" aria-hidden="true">
      <svg
        class="dashboard-card__arrow-icon"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M5 12H19M19 12L13 6M19 12L13 18"
          stroke="currentColor"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>

    <div class="dashboard-card__title">DASHBOARD</div>
  </div>

  <div class="dashboard-card__content">
    <app-heatmap-small
      class="dashboard-card__heatmap"
      [layout]="'landscape'"
      [days]="28"
    ></app-heatmap-small>
  </div>
</div>
